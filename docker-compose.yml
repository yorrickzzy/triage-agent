services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: chamber-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: chamber
      POSTGRES_PASSWORD: chamber_password
      POSTGRES_DB: chamber

    ports:
      - "5432:5432"

    volumes:
      - chamber_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U chamber -d chamber"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: chamber-jaeger
    restart: unless-stopped

    environment:
      COLLECTOR_OTLP_ENABLED: "true"

    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  app:
    build:
      context: .
      dockerfile: Dockerfile

    image: triage-agent:local
    container_name: chamber-agent
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg://chamber:chamber_password@postgres:5432/chamber
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318/v1/traces

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started

volumes:
  chamber_postgres_data: